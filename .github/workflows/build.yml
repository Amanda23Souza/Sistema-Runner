name: Build, Test and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Extract version metadata
        id: version
        shell: bash
        run: |
          echo "VERSION=$(git describe --tags --always 2>/dev/null || echo 'v1.0.0')" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Download dependencies
        working-directory: cli-assinatura
        run: go mod download

      - name: Run tests
        working-directory: cli-assinatura
        run: go test -v ./...

      - name: Build binary
        id: build
        working-directory: cli-assinatura
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="${{ github.event.repository.name }}-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -ldflags="-s -w \
            -X 'github.com/Amanda23Souza/Sistema-Runner/cli-assinatura/internal/version.Version=${{ steps.version.outputs.VERSION }}' \
            -X 'github.com/Amanda23Souza/Sistema-Runner/cli-assinatura/internal/version.Commit=${{ steps.version.outputs.COMMIT }}' \
            -X 'github.com/Amanda23Souza/Sistema-Runner/cli-assinatura/internal/version.BuildTime=${{ steps.version.outputs.BUILDTIME }}'" -o "$BINARY_NAME" ./cmd/assinatura
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_OUTPUT

      - name: Generate Checksum
        working-directory: cli-assinatura
        run: |
          sha256sum ${{ steps.build.outputs.BINARY_NAME }} > ${{ steps.build.outputs.BINARY_NAME }}.sha256

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3.4.0

      - name: Sign binary (Keyless OIDC)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: cli-assinatura
        run: |
          cosign sign-blob --yes ${{ steps.build.outputs.BINARY_NAME }} \
            --output-signature ${{ steps.build.outputs.BINARY_NAME }}.sig \
            --output-certificate ${{ steps.build.outputs.BINARY_NAME }}.pem

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.BINARY_NAME }}
          path: |
            cli-assinatura/${{ steps.build.outputs.BINARY_NAME }}
            cli-assinatura/${{ steps.build.outputs.BINARY_NAME }}.sha256
            cli-assinatura/${{ steps.build.outputs.BINARY_NAME }}.sig
            cli-assinatura/${{ steps.build.outputs.BINARY_NAME }}.pem
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare dist directory
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -R dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
