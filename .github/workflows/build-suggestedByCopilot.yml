# subtrecho sugerido (substituir os passos 'Download dependencies' .. 'Upload artifact')
- name: Download dependencies
  working-directory: cli-assinatura
  run: go mod download

- name: Extract version
  id: version
  shell: bash
  run: echo "VERSION=$(git describe --tags --always 2>/dev/null || echo 'v0.1.0')" >> $GITHUB_OUTPUT

- name: Run tests
  working-directory: cli-assinatura
  run: go test -v ./...

- name: Build binary
  env:
    GOOS: ${{ matrix.goos }}
    GOARCH: ${{ matrix.goarch }}
    CGO_ENABLED: 0
  working-directory: cli-assinatura
  run: |
    BINARY_NAME="${{ github.event.repository.name }}-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
    go build -ldflags="-s -w" -o "$BINARY_NAME" ./cmd/assinatura

- name: Upload artifact
  uses: actions/upload-artifact@v4
  with:
    name: ${{ github.event.repository.name }}-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
    path: ${{ github.event.repository.name }}-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
    if-no-files-found: error
    retention-days: 7